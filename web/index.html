<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FULCRUM Copilot</title><style>body{font:16px system-ui;margin:0;background:#f5f7fb;color:#172033}.shell{max-width:900px;margin:5vh auto;background:white;border:1px solid #dce2ee;border-radius:12px;padding:24px}.context{background:#eef4ff;padding:12px;border-radius:8px}.messages{min-height:240px;margin:20px 0}.msg{padding:12px;margin:8px 0;border-radius:8px;background:#f1f3f7}.user{background:#e4f5ed}.composer{display:flex;gap:8px}input{flex:1;padding:12px;border:1px solid #bbc5d6;border-radius:6px}button{padding:12px 16px;border:0;border-radius:6px;background:#155eef;color:#fff}</style></head>
<body><main class="shell"><h1>FULCRUM Copilot</h1><div class="context">Assessment context: <strong>FA-2026-00124</strong> · Cross-Border Wallet Expansion</div><section id="messages" class="messages"><div class="msg">I can explain governed assessment data, deterministic scores, evidence, controls, overrides, and linked Jira work items. I cannot make committee decisions.</div></section><form id="form" class="composer"><input id="question" placeholder="Why is AML residual risk High?" autocomplete="off"><button>Ask</button></form></main><script>const form=document.querySelector('#form'),q=document.querySelector('#question'),m=document.querySelector('#messages');form.onsubmit=async e=>{e.preventDefault();if(!q.value.trim())return;const text=q.value;m.insertAdjacentHTML('beforeend',`<div class="msg user"></div>`);m.lastChild.textContent=text;q.value='';const r=await fetch('/api/copilot/respond',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({assessmentId:'FA-2026-00124',message:text})});const data=await r.json();const el=document.createElement('div');el.className='msg';el.textContent=data.answer||data.error;m.append(el)};</script></body></html>
